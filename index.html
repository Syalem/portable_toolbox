<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portable Toolbox</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><path d='M22 25v-8a8 8 0 0 1 8-8h4a8 8 0 0 1 8 8v8' fill='none' stroke='%2300d4ff' stroke-width='6' stroke-linecap='round'/><rect x='5' y='25' width='54' height='31' rx='7' fill='%2300d4ff'/><rect x='5' y='36' width='54' height='6' fill='%231a2a45'/></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
        }
        .header { text-align: center; margin-bottom: 50px; }
        .header h1 { font-size: 3rem; color: #00d4ff; margin-bottom: 10px; }
        .header p { font-size: 1.1rem; color: #888; }
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            max-width: 1200px;
            width: 100%;
        }
        .tool-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 212, 255, 0.2);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tool-card:hover {
            transform: translateY(-5px);
            border-color: #00d4ff;
            box-shadow: 0 10px 40px rgba(0, 212, 255, 0.2);
        }
        .tool-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            background: rgba(0, 212, 255, 0.1);
        }
        .tool-card h2 { font-size: 1.3rem; color: #00d4ff; margin-bottom: 10px; }
        .tool-card p { color: #888; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧰 Portable Toolbox</h1>
        <p>Your everyday tools, always with you</p>
    </div>
    <div class="tools-grid">
        <div class="tool-card" onclick="window.location.href='timer/'">
            <div class="tool-icon">⏱️</div>
            <h2>Visual Timer</h2>
            <p>Countdown timer with animated progress</p>
        </div>
        <div class="tool-card" onclick="window.location.href='vacances/'">
            <div class="tool-icon">📅</div>
            <h2>Vacances</h2>
            <p>Plan your vacation days (Baden-Württemberg)</p>
        </div>
        <div class="tool-card" onclick="window.location.href='pdf-tools/'">
            <div class="tool-icon">📄</div>
            <h2>PDF Tools</h2>
            <p>Merge or split PDF files in your browser</p>
        </div>
        <div class="tool-card" onclick="window.location.href='work_time_calculator/'">
            <div class="tool-icon">⏰</div>
            <h2>Work Time Calculator</h2>
            <p>Find out when your 8-hour workday ends</p>
        </div>
    </div>
</body>
</html>
